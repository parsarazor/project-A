name: CI

on:
  push:
    branches: [main]
    paths: ["url-shortener/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["url-shortener/**", ".github/workflows/ci.yml"]

jobs:
  test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url-shortener
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: url-shortener/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -v -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
