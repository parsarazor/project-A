version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VERSION: ${VERSION:-dev}
    image: url-shortener-api:${VERSION:-dev}
    container_name: url-shortener-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required - set it in .env or the environment}
      - DB_NAME=${DB_NAME:-urlshortener}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - generate one with: openssl rand -base64 48}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-300}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10}
      # Allowlist of reverse-proxy IPs/CIDs (comma-separated) so client IPs
      # (and therefore rate limiting) resolve correctly behind a load balancer.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # One-shot schema migration: runs /app/migrate (AutoMigrate) against the
  # database before the API starts, so a fresh volume is usable on first boot.
  # Re-run manually after an image upgrade with:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VERSION: ${VERSION:-dev}
    image: url-shortener-api:${VERSION:-dev}
    container_name: url-shortener-migrate-prod
    restart: "no"
    entrypoint: ["/app/migrate"]
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required - set it in .env or the environment}
      - DB_NAME=${DB_NAME:-urlshortener}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - generate one with: openssl rand -base64 48}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - url-shortener-network

  db:
    image: postgres:15-alpine
    container_name: url-shortener-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required - set it in .env or the environment}
      - POSTGRES_DB=${DB_NAME:-urlshortener}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-urlshortener}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data_prod:
    driver: local

networks:
  url-shortener-network:
    driver: bridge
